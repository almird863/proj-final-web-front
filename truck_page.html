<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Place | Food Truck</title>
</head>

<body class="page-detalhes">
    <header class="main-header">
        <a href="index.html">
            <img src="assets/tp-logo.png" alt="">
            <h1 class="hide-text">Truck Place</h1>
        </a>
        <nav>
            <div class="menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="pesquisar.html">Pesquisar</a></li>
                    <li><a href="login.html">LOGIN</a></li>
                    <li><a href="cadastro.html">CADASTRAR</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>

        <!-- Section de Destaque | Mais informações -->
        <section>
            <div>
                <img src="" alt="" id="ft-img">
            </div>
            <div>
                <div>
                    <h1 id="ft-titulo">Carregando...</h1>
                    <a href="#" id="fav-icon">
                        <img src="assets/fav_hollow.svg" alt="icone favorito">
                    </a>
                    <a href="#" id="wpp-icon">
                        <img src="assets/wpp.webp" alt="botao whatsapp" id="ft-wpp">
                    </a>
                </div>
                <div>
                    <p id="ft-desc"></p>
                </div>
            </div>
        </section>

        <section>
            <div>
                <h2>O Que Oferece</h2>
                <p id="ft-oferece"></p>
            </div>
            <div>
                <h2>Local e Horário</h2>
                <ul>
                    <li id="ft-horario"></li>
                    <li id="ft-local"></li>
                </ul>
            </div>
            <div>
                <iframe id="ft-mapa" class="ft-mapa" src="" title="Mapa do food truck"></iframe>
            </div>
        </section>

        <!-- Section de Review -->
        <section>
            <div>
                <input type="text" id="comment-box" placeholder="Digite seu comentário" maxlength="350">
                <button id="comment-box-submit">Enviar</button>
            </div>
            <div id="comment-box-area">
                <!-- cards gerados pelo JavaScript -->
            </div>
        </section>

        <!-- Section de outras recomendações -->
        <section>
            <h3>Você também pode gostar:</h3>
            <div id="ft-recomendacoes">
                <!-- cards gerados pelo JavaScript -->
            </div>
        </section>
    </main>
    <footer>
        <div>
            <a href="">
                <img src="assets/tp-logo.png" alt="logo truck place">
            </a>
        </div>
        <div>
            <ul>
                <li>(85) 9 9999-8888</li>
                <li>contato@truckplace.com</li>
            </ul>
        </div>
        <p>Truck Place &copy; 2026. Todos os direitos reservados.</p>
    </footer>
    <script src="javascript/detalhes.js"></script>
</body>

</html>
